<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>별하 일본어</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFF8EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="별하 일본어">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<script>
  /* 디자인 시안: 주소의 ?theme= 또는 설정에서 고른 값 */
  (function () {
    var t = null;
    try { t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('bn_theme'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', t || 'ivory');
  })();
</script>
</head>
<body>
<div id="app"></div>
<script src="ver.js"></script>
<script src="audio/index.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
